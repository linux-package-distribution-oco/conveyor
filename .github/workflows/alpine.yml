# The package conveyor: a signed Alpine (apk) repository built from the release's own APKBUILD - for
# postmarketOS phones - a page for it, deployed only when every signature verifies, then installed the
# way a phone would. Called, not copied (README.md): the project keeps its declaration, its APKBUILD and
# its public key; the private key is the project's secret APK_SIGNING_KEY.
#
# The key reaches one step only - packaging and indexing, after the project's code was built in steps
# that never saw it - and lives in that step's container for the step's length.
name: alpine
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish
        required: true
        type: string
      declaration:
        description: The project's conveyor declaration
        required: false
        type: string
        default: packaging/conveyor.toml
    secrets:
      APK_SIGNING_KEY:
        description: The repository signing key (an RSA private key, PEM - as abuild-keygen makes)
        required: true
permissions: {}
jobs:
  plan:
    name: read the declaration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      name: ${{ steps.d.outputs.name }}
      version: ${{ steps.d.outputs.version }}
      apkbuild: ${{ steps.d.outputs.apkbuild }}
      key: ${{ steps.d.outputs.key }}
      release: ${{ steps.d.outputs.release }}
      repo: ${{ steps.d.outputs.repo }}
      archs: ${{ steps.d.outputs.archs }}
      title: ${{ steps.d.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - id: d
        env:
          DECLARATION: ${{ inputs.declaration }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          j="$(yq -p toml -o json '.' "$DECLARATION")"
          get() { printf '%s' "$j" | jq -r "$1"; }
          name="$(get '.package.name')"; prefix="$(get '.package["tag-prefix"] // "v"')"
          [ -n "$(get '.alpine.apkbuild // empty')" ] || { echo "the declaration has no [alpine] apkbuild" >&2; exit 1; }
          {
            echo "name=$name"
            echo "version=${TAG#"$prefix"}"
            echo "apkbuild=$(get '.alpine.apkbuild')"
            echo "key=$(get '.alpine.key')"
            echo "release=$(get '.alpine.release // "3.24"')"
            echo "repo=$(get '.alpine.repo // .package.name')"
            echo "archs=$(get '.alpine.archs // ["aarch64"] | tojson')"
            echo "title=$(get '.site.title // (.package.name + " packages")')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          [ -f "$(get '.alpine.key')" ] || { echo "the public key $(get '.alpine.key') is not in the repository" >&2; exit 1; }
  build:
    name: build and sign (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.archs) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: project
      - name: The APKBUILD for this release - its folder whole, its version
        env:
          APKBUILD: ${{ needs.plan.outputs.apkbuild }}
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ needs.plan.outputs.repo }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          set -eu
          # abuild names the repository after the folder above the package's own; the APKBUILD's folder
          # comes whole, for the files beside it (source=, install=) that abuild fetches and verifies
          mkdir -p "w/$REPO/$NAME" out site && cp -R "project/$(dirname "$APKBUILD")/." "w/$REPO/$NAME/" && rm -rf "w/$REPO/$NAME/.git"
          [ "$(basename "$APKBUILD")" = APKBUILD ] || mv "w/$REPO/$NAME/$(basename "$APKBUILD")" "w/$REPO/$NAME/APKBUILD"
          # a run replaces the packages whose origin is NAME, so NAME is the APKBUILD's own pkgname
          have="$(sed -n 's/^pkgname=//p' "w/$REPO/$NAME/APKBUILD" | tr -d "\"'" | head -1)"
          [ "$have" = "$NAME" ] || { echo "the declaration's package name is $NAME, the APKBUILD's pkgname is $have" >&2; exit 1; }
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=0/" "w/$REPO/$NAME/APKBUILD"
          grep -E '^(pkgver|pkgrel)=' "w/$REPO/$NAME/APKBUILD"
      - name: The packages the repository already holds, kept
        env:
          REPO: ${{ needs.plan.outputs.repo }}
          NAME: ${{ needs.plan.outputs.name }}
          RELEASE: ${{ needs.plan.outputs.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # One repository holds every package of the project's pages: the live index says which, and each
          # package that does not come from this APKBUILD (its origin is not NAME) is fetched into the
          # repository folder, so the signed index below covers them all. The pages are replaced whole at
          # a deploy; this is how an earlier package survives it. No live repository yet is no earlier package.
          base="${PAGES_BASE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          url="$base/alpine/v$RELEASE/$REPO/$ARCH"
          # an index lists, per package: its name, its version and its origin
          apkindex() {
            txt="$(tar -xzOf "$1" APKINDEX)" || return 1
            printf '%s\n' "$txt" | awk 'BEGIN { RS = ""; FS = "\n" }
              { p = ""; v = ""; o = ""
                for (i = 1; i <= NF; i++) { if ($i ~ /^P:/) p = substr($i, 3); if ($i ~ /^V:/) v = substr($i, 3); if ($i ~ /^o:/) o = substr($i, 3) }
                if (p != "") { if (o == "") o = p; print p, v, o } }'
          }
          dir="out/$REPO/$ARCH"; mkdir -p "$dir"
          # the query keeps a cache of the pages (about ten minutes) from serving an index older than the last deploy
          code="$(curl -sS -o live.tar.gz -w '%{http_code}' --retry 3 "$url/APKINDEX.tar.gz?run=${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}")"
          case "$code" in
            404) echo "no live repository at $url: nothing earlier to keep"; exit 0 ;;
            200) ;;
            *) echo "the live index answered $code: an earlier package would be lost, so no build" >&2; exit 1 ;;
          esac
          live="$(apkindex live.tar.gz)"
          printf '%s\n' "$live" | awk -v name="$NAME" '$3 != name { print $1 "-" $2 ".apk" }' > kept.txt
          while read -r f; do
            case "$f" in ""|*/*|.*) echo "FAIL: the live index names a file that is not a plain file name: $f" >&2; exit 1 ;; esac
            curl -fsS --retry 3 -o "$dir/$f" "$url/$f"
            echo "  kept $f"
          done < kept.txt
      - name: Build (the project's code - in a container of its own, which never sees the key)
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
          REPO: ${{ needs.plan.outputs.repo }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          docker run --rm -e REPO -e NAME -v "$PWD/w:/w" "alpine:$RELEASE" sh -euc '
            apk add -q --no-cache alpine-sdk
            cd "/w/$REPO/$NAME"
            abuild -F checksum
            abuild -F deps fetch verify unpack prepare build'
      - name: Package and index, signed (a fresh container, the only one with the key)
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          RELEASE: ${{ needs.plan.outputs.release }}
          KEY: ${{ needs.plan.outputs.key }}
          REPO: ${{ needs.plan.outputs.repo }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          docker run --rm -e APK_SIGNING_KEY -e REPO -e NAME -e KEYNAME="$(basename "$KEY" .pub)" \
            -v "$PWD/w:/w" -v "$PWD/out:/out" -v "$PWD/project/$KEY:/pub.key:ro" "alpine:$RELEASE" sh -euc '
            apk add -q --no-cache alpine-sdk openssl
            mkdir -p /root/.abuild && umask 077
            printf "%s\n" "$APK_SIGNING_KEY" > "/root/.abuild/$KEYNAME"; unset APK_SIGNING_KEY
            openssl rsa -in "/root/.abuild/$KEYNAME" -pubout 2>/dev/null | cmp -s - /pub.key ||
              { echo "the secret key is not the one whose public half is committed" >&2; exit 1; }
            cp /pub.key "/root/.abuild/$KEYNAME.pub" && cp /pub.key "/etc/apk/keys/$KEYNAME.pub"
            printf "PACKAGER_PRIVKEY=\"/root/.abuild/%s\"\nREPODEST=/out\n" "$KEYNAME" > /root/.abuild/abuild.conf
            cd "/w/$REPO/$NAME"
            abuild -F rootpkg
            abuild -F index
            chmod -R a+rX /out'
          find out -type f | sort
          [ -n "$(find out -name "*.apk")" ] || { echo "no package was built" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-${{ matrix.arch }}
          path: out
  publish:
    name: check and publish
    needs: [plan, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: alpine-*
          path: built
          merge-multiple: true
      - name: The front page, the key, and the repository
        env:
          KEY: ${{ needs.plan.outputs.key }}
          RELEASE: ${{ needs.plan.outputs.release }}
          REPO: ${{ needs.plan.outputs.repo }}
          TITLE: ${{ needs.plan.outputs.title }}
        run: |
          set -eu
          base="${PAGES_BASE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          mkdir -p "site/alpine/v$RELEASE" site/keys && cp -r built/. "site/alpine/v$RELEASE/" && cp "$KEY" site/keys/ && touch site/.nojekyll
          keyfile="$(basename "$KEY")"
          # the packages the page offers are the origins its signed indexes list - every package of the
          # repository, this release's and the ones kept - not what this one run was told; every
          # architecture's index lists the same ones (packages of one repository share their archs)
          names=""
          for idx in $(find "site/alpine/v$RELEASE/$REPO" -name APKINDEX.tar.gz | sort); do
            txt="$(tar -xzOf "$idx" APKINDEX)"
            these="$(printf '%s\n' "$txt" | sed -n 's/^o://p' | sort -u | tr '\n' ' ')"
            [ -n "$these" ] || { echo "the index $idx lists no package" >&2; exit 1; }
            [ -z "$names" ] || [ "$these" = "$names" ] || { echo "FAIL: the architectures' indexes list different packages ($names / $these): the packages of one repository share their archs" >&2; exit 1; }
            names="$these"
          done
          [ -n "$names" ] || { echo "no index was built" >&2; exit 1; }
          adds="$(for n in $names; do printf 'apk add %s\n' "$n"; done)"
          cat > site/index.html <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>${TITLE}</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem}pre{background:#f4f4f4;padding:.8rem;overflow:auto;border-radius:6px}</style></head>
          <body><h1>${TITLE}</h1><p>An Alpine (apk) repository for <a href="https://github.com/${GITHUB_REPOSITORY}">${GITHUB_REPOSITORY}</a>, for postmarketOS and Alpine ${RELEASE}, so apk updates it with the rest of the system.</p>
          <p>Signing key: <a href="keys/${keyfile}">${keyfile}</a></p><pre>wget -qO /etc/apk/keys/${keyfile} ${base}/keys/${keyfile}
          echo ${base}/alpine/v${RELEASE}/${REPO} &gt;&gt; /etc/apk/repositories
          apk update
          ${adds}</pre>
          <p>Delivered by the <a href="https://github.com/linux-package-distribution-oco/conveyor">package conveyor</a>.</p></body></html>
          HTML
          find site -type f | sort
      - name: Nothing is deployed unless every signature verifies
        env:
          KEY: ${{ needs.plan.outputs.key }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          docker run --rm -v "$PWD/site:/site:ro" -v "$PWD/$KEY:/etc/apk/keys/$(basename "$KEY"):ro" "alpine:$RELEASE" sh -euc '
            n=0
            for p in $(find /site/alpine -name "*.apk"); do apk verify "$p" >/dev/null || { echo "FAIL: $p" >&2; exit 1; }; n=$((n+1)); done
            [ "$n" -gt 0 ] || { echo "FAIL: no package was built" >&2; exit 1; }
            for i in $(find /site/alpine -name APKINDEX.tar.gz); do apk verify "$i" >/dev/null || { echo "FAIL: $i" >&2; exit 1; }; done
            echo "  ok  apk: every package ($n) and every index verify against the committed key"'
      - name: Nothing already live is lost
        env:
          NAME: ${{ needs.plan.outputs.name }}
          RELEASE: ${{ needs.plan.outputs.release }}
          REPO: ${{ needs.plan.outputs.repo }}
        run: |
          set -eu
          # A deploy replaces the pages whole. If a package is live that this site does not hold at that
          # version (another package's run deployed between this run's build and now), say so and deploy
          # nothing: running the packages jobs one after another (needs:) is the caller's half of the same
          # rule. Every architecture that is live is looked at, the ones this site has no index for too.
          base="${PAGES_BASE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          apkindex() {
            txt="$(tar -xzOf "$1" APKINDEX)" || return 1
            printf '%s\n' "$txt" | awk 'BEGIN { RS = ""; FS = "\n" }
              { p = ""; v = ""; o = ""
                for (i = 1; i <= NF; i++) { if ($i ~ /^P:/) p = substr($i, 3); if ($i ~ /^V:/) v = substr($i, 3); if ($i ~ /^o:/) o = substr($i, 3) }
                if (p != "") { if (o == "") o = p; print p, v, o } }'
          }
          for arch in aarch64 x86_64 armv7 armhf x86 riscv64 ppc64le s390x loongarch64; do
            rel="alpine/v$RELEASE/$REPO/$arch/APKINDEX.tar.gz"
            code="$(curl -sS -o live.tar.gz -w '%{http_code}' --retry 3 "$base/$rel?run=${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}")"
            case "$code" in 404) continue ;; 200) ;; *) echo "the live $rel answered $code" >&2; exit 1 ;; esac
            [ -f "site/$rel" ] || { echo "FAIL: $rel is live and this site has no index for that architecture" >&2; exit 1; }
            live="$(apkindex live.tar.gz)"
            here="$(apkindex "site/$rel")"
            printf '%s\n' "$here" | awk '{ print $1 "-" $2 }' > site.pkgs
            lost="$(printf '%s\n' "$live" | awk -v name="$NAME" '$3 != name { print $1 "-" $2 }' | grep -vxF -f site.pkgs || true)"
            [ -z "$lost" ] || { echo "FAIL: live in $rel and not in this site: $lost" >&2; exit 1; }
          done
          echo "  ok  every package that is live is in the site, at its live version"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait a minute before the second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - name: Deploy (second try)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
  verify:
    name: apk repository, real install (${{ matrix.arch }})
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.archs) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: alpine:${{ needs.plan.outputs.release }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: The page's own lines, then every package, as a phone takes it
        env:
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ needs.plan.outputs.repo }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -eu
          base="${PAGES_BASE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          # the pages are live when the page lists this package AND the index serves this release of it
          # (a page from an earlier release of the same package would otherwise pass for the new one)
          live() {
            wget -qO /tmp/index.html "$base/?run=$$" && grep -Eq "apk add $NAME(</pre>)?\$" /tmp/index.html &&
              wget -qO /tmp/live.tar.gz "$base/alpine/v$RELEASE/$REPO/$(apk --print-arch)/APKINDEX.tar.gz?run=$$" &&
              tar -xzOf /tmp/live.tar.gz APKINDEX | awk -v n="$NAME" -v v="$VERSION-r0" 'BEGIN { RS = ""; FS = "\n" }
                { p = ""; q = ""; for (i = 1; i <= NF; i++) { if ($i ~ /^P:/) p = substr($i, 3); if ($i ~ /^V:/) q = substr($i, 3) } if (p == n && q == v) f = 1 }
                END { exit !f }'
          }
          for _ in 1 2 3 4 5 6; do live && break; sleep 20; done
          live || { echo "FAIL: the pages do not serve $NAME $VERSION" >&2; exit 1; }
          sed -n '/<pre>/,/<\/pre>/p' /tmp/index.html | sed -e 's/.*<pre>//' -e 's/<\/pre>.*//' -e 's/<[^>]*>//g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' | sed '/^$/d' > /tmp/snippet.sh
          cat /tmp/snippet.sh && sh -eu /tmp/snippet.sh
          # every package the page offers is installed, and this release's at its tagged version
          names="$(sed -n 's/^apk add //p' /tmp/snippet.sh | tr '\n' ' ')"
          [ -n "$names" ] || { echo "FAIL: the page offers no package" >&2; exit 1; }
          case " $names " in *" $NAME "*) ;; *) echo "FAIL: the page does not offer $NAME" >&2; exit 1 ;; esac
          for n in $names; do
            apk info -e "$n" >/dev/null || { echo "FAIL: $n is not installed" >&2; exit 1; }
            have="$(apk list --installed "$n" | head -1)"
            if [ "$n" = "$NAME" ]; then
              case "$have" in "$n-$VERSION-r"*" "*) ;; *) echo "FAIL: installed $have, not $VERSION" >&2; exit 1 ;; esac
            fi
            echo "  ok  installed $have"
          done
          apk info -L "$NAME" | head -40
